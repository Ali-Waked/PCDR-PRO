; Production PHP settings for the preview image (apply to FPM and CLI).
expose_php = Off
memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 10M
post_max_size = 11M
date.timezone = UTC

; Code and Blade caches are built during container startup, not on each request.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
