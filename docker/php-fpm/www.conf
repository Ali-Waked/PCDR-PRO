[www]

user = www-data
group = www-data

; Loopback only: PHP-FPM is never published outside the container.
listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Runtime secrets (APP_KEY, DB_*, MAIL_*) must reach Laravel workers.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

security.limit_extensions = .php

; Docker/Render log collectors read stdout and stderr.
access.log = /proc/self/fd/2
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
